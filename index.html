<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width'><title>FireFlix</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:Arial;padding-bottom:140px}
.header{padding:15px;background:#000;position:fixed;top:0;width:100%;z-index:10}.logo{color:#ff9900;font-size:26px;font-weight:900}
.hero{margin-top:60px;height:55vh;background:linear-gradient(90deg,#000 70%,transparent),url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800') center/cover;display:flex;align-items:center;padding:20px}
.hero h1{font-size:32px}.row{padding:15px 0 0 15px}.cards{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.card{width:140px;flex-shrink:0;border:3px solid transparent;border-radius:8px;overflow:hidden;background:#1a1a1a;transition:.2s}.card img{width:100%;height:200px;object-fit:cover}.card.focused{border-color:#fff;transform:scale(1.08);box-shadow:0 0 20px #fff5}
.dpad{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #333;padding:10px 18px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:99}
.dpad button{width:52px;height:52px;border-radius:10px;border:none;background:#2a2a2a;color:#fff;font-size:20px}.dpad button:active{background:#ff9900;color:#000}.center{background:#ff9900!important;color:#000!important;border-radius:50%!important}
.label{font-size:10px;opacity:.6}.row2{display:flex;gap:10px}</style></head>
<body>
<div class="header"><div class="logo">FireFlix</div></div>
<div class="hero focused"><div><div style="color:#00a8e1;font-size:11px;font-weight:bold">QUANTUM HORIZON - AMAZON ORIGINAL</div><h1>Explore The Unknown</h1><p style="font-size:13px;opacity:.7;margin:10px 0">Built for Fire TV with D-pad navigation</p><button style="background:#ff9900;color:#000;padding:8px 16px;border:none;border-radius:4px;font-weight:bold">▶ Watch Now</button></div></div>
<div class="row"><div style="font-weight:bold;margin-bottom:8px">Continue Watching</div><div class="cards">
<div class="card focused"><img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400"><div style="padding:6px;font-size:12px">The Last Frontier</div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400"><div style="padding:6px;font-size:12px">Quantum Horizon</div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1574267432553-4b4628081c31?w=400"><div style="padding:6px;font-size:12px">Midnight Echo</div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=400"><div style="padding:6px;font-size:12px">Neon City</div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400"><div style="padding:6px;font-size:12px">Future World</div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400"><div style="padding:6px;font-size:12px">Jungle Quest</div></div>
</div></div>
<div class="dpad"><div class="label">🔥 Fire TV Remote - Yaha Tap Karo 👇</div><div class="row2"><button onclick="m('up')">⬆️</button></div><div class="row2"><button onclick="m('left')">⬅️</button><button class="center" onclick="ok()">OK</button><button onclick="m('right')">➡️</button></div><div class="row2"><button onclick="m('down')">⬇️</button></div></div>
<script>
let cards=document.querySelectorAll('.card'); let cur=0;
function setF(i){if(i<0)i=0;if(i>=cards.length)i=cards.length-1;cards[cur].classList.remove('focused');cur=i;cards[cur].classList.add('focused');cards[cur].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
function m(d){if(d=='right')setF(cur+1);if(d=='left')setF(cur-1);if(d=='down')setF(cur+2);if(d=='up')setF(cur-2);}
function ok(){cards[cur].style.transform='scale(1.15)';setTimeout(()=>cards[cur].style.transform='',200)}
</script></body></html>
